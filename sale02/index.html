<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8F助理員專用系統</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: "Microsoft JhengHei", sans-serif; background: #f0f3f5; overflow: hidden; }
        
        /* 💡 啟動首頁：大按鈕畫面 */
        #home_screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2000;
            transition: transform 0.4s ease;
        }

        /* 當選定功能後，首頁往上滑消失 */
        #home_screen.hidden { transform: translateY(-100%); }

        .system-title { color: white; font-size: 28px; margin-bottom: 40px; letter-spacing: 2px; font-weight: bold; }

        .menu-container { display: flex; flex-direction: column; gap: 20px; width: 85%; max-width: 400px; }

        /* 💡 大圖示按鈕樣式 */
        .menu-btn {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .menu-btn:active { transform: scale(0.95); background: #ecf0f1; }
        .menu-btn i { font-size: 24px; }

        /* 💡 內容區：佔滿全螢幕 */
        .content-area { width: 100vw; height: 100vh; position: relative; background: white; }
        iframe { width: 100%; height: 100%; border: none; }

        /* 💡 返回按鈕：在表格畫面的左上角 */
        #back_btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(44, 62, 80, 0.8);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50px;
            font-size: 14px;
            cursor: pointer;
            z-index: 1000;
            display: none; /* 預設隱藏，進入表格才顯示 */
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="home_screen">
        <div class="system-title">8F 助理員系統</div>
        <div class="menu-container">
            <button class="menu-btn" onclick="openFrame('page1.html')">📋 助理員工作登記表</button>
            <button class="menu-btn" onclick="openFrame('page2.html')">📦 缺物登記紀錄表</button>
            <button class="menu-btn" onclick="openFrame('page3.html')">🛠️ 請修登記紀錄表</button>
        </div>
        <div style="color: rgba(255,255,255,0.5); margin-top: 50px; font-size: 12px;">v2026.03 版</div>
    </div>

    <div class="content-area">
        <button id="back_btn" onclick="goBack()">⬅ 返回主選單</button>
        <iframe id="display_box" src=""></iframe>
    </div>

    <script>
        function openFrame(url) {
            const displayBox = document.getElementById('display_box');
            const home = document.getElementById('home_screen');
            const backBtn = document.getElementById('back_btn');

            displayBox.src = url; // 載入網頁
            home.classList.add('hidden'); // 隱藏首頁
            backBtn.style.display = 'block'; // 顯示返回按鈕
        }

        function goBack() {
            const home = document.getElementById('home_screen');
            const backBtn = document.getElementById('back_btn');
            
            home.classList.remove('hidden'); // 顯示首頁
            backBtn.style.display = 'none'; // 隱藏返回按鈕
            
            // 可選：返回時清空 iframe 節省資源
            // document.getElementById('display_box').src = "";
        }
    </script>
</body>
</html>
