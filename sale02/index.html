<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8F助理員專用系統</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: #f4f7f6; }
        
        .main-wrapper { display: flex; height: 100vh; width: 100vw; position: relative; }
        
        /* 💡 側邊欄：改為絕對定位，不佔據空間，避免擠壓內容 */
        .sidebar { 
            position: absolute;
            top: 0;
            left: 0;
            width: 260px; 
            height: 100%;
            background: #2c3e50; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 4px 0 10px rgba(0,0,0,0.3); 
            z-index: 2000; /* 確保在最前方 */
            transition: transform 0.3s ease-in-out;
            transform: translateX(0); /* 預設顯示 */
        }

        /* 💡 隱藏狀態：直接移出螢幕外 */
        .sidebar.collapsed {
            transform: translateX(-110%);
        }

        .sidebar-header { padding: 30px 20px; font-weight: bold; font-size: 20px; background: #1a252f; text-align: center; }
        
        .nav-item { 
            padding: 20px; cursor: pointer; border-left: 5px solid transparent; 
            transition: 0.3s; font-size: 17px; border-bottom: 1px solid #34495e;
        }
        .nav-item:hover { background: #34495e; }
        .nav-item.active { background: #3498db; border-left-color: #fff; }

        /* 💡 內容區：永遠保持 100% 寬度，不再被擠壓 */
        .content-frame-container { 
            width: 100%; 
            height: 100%; 
            background: #fff; 
        }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* 💡 漢堡按鈕：改為圓形浮動感，更適合手機點擊 */
        .toggle-btn {
            position: absolute;
            top: 15px;
            left: 15px; 
            z-index: 1500;
            background: #2c3e50;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        /* 💡 遮罩層：選單打開時，背景變暗 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1800;
            display: none;
        }
        .sidebar:not(.collapsed) ~ .overlay { display: block; }

        /* 📱 手機版專屬樣式 */
        @media screen and (max-width: 768px) {
            .sidebar { width: 80vw; }
            .nav-item { padding: 25px 20px; font-size: 20px; }
            .sidebar-header { font-size: 22px; }
        }

        @media print { .sidebar, .toggle-btn, .overlay { display: none !important; } }
    </style>
</head>
<body>

<button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">☰</button>

<div class="main-wrapper">
    <aside class="sidebar collapsed" id="sidebar">
        <div class="sidebar-header">8F助理員系統</div>
        <div class="nav-item active" onclick="switchFrame('page1.html', this)">助理員工作登記表</div>
        <div class="nav-item" onclick="switchFrame('page2.html', this)">缺物登記紀錄表</div>
        <div class="nav-item" onclick="switchFrame('page3.html', this)">請修登記紀錄表</div>
    </aside>

    <div class="overlay" onclick="toggleSidebar()"></div>

    <main class="content-frame-container">
        <iframe id="display_box" src="page1.html"></iframe>
    </main>
</div>

<script>
    function switchFrame(url, el) {
        document.getElementById('display_box').src = url;
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        toggleSidebar(); // 選好後自動收起
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
    }
</script>

</body>
</html>
