<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.6, maximum-scale=1.0, user-scalable=yes">
    <title>8F助理員專用系統</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: "Microsoft JhengHei", sans-serif; background: #f0f3f5; }
        
        #home_screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #home_screen.hidden { transform: translateY(-100%); }
        .system-title { color: white; font-size: 28px; margin-bottom: 40px; font-weight: bold; letter-spacing: 2px; }
        .menu-container { display: flex; flex-direction: column; gap: 20px; width: 85%; max-width: 400px; }
        .big-btn {
            background: white; padding: 25px; border-radius: 15px;
            text-align: center; font-size: 20px; font-weight: bold; color: #2c3e50;
            border: none; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .big-btn:active { transform: scale(0.96); background: #ecf0f1; }
        .content-area { width: 100vw; height: 100vh; background: white; position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        #back_btn {
            position: absolute; top: 12px; left: 12px; z-index: 1500;
            background: rgba(44, 62, 80, 0.9); color: white; border: none;
            padding: 10px 18px; border-radius: 50px; font-size: 15px; font-weight: bold;
            cursor: pointer; display: none;
        }
    </style>
</head>
<body>
    <div id="home_screen">
        <div class="system-title">8F 助理員系統</div>
        <div class="menu-container">
            <button class="big-btn" onclick="openFrame('page1.html')">📋 助理員工作登記表</button>
            <button class="big-btn" onclick="openFrame('page2.html')">📦 缺物登記紀錄表</button>
            <button class="big-btn" onclick="openFrame('page3.html')">🛠️ 請修登記紀錄表</button>
        </div>
    </div>
    <div class="content-area">
        <button id="back_btn" onclick="goHome()">⬅ 返回主選單</button>
        <iframe id="display_box" src=""></iframe>
    </div>
    <script>
        function openFrame(url) {
            document.getElementById('display_box').src = url;
            document.getElementById('home_screen').classList.add('hidden');
            document.getElementById('back_btn').style.display = 'block';
        }
        function goHome() {
            document.getElementById('home_screen').classList.remove('hidden');
            document.getElementById('back_btn').style.display = 'none';
        }
    </script>
</body>
</html>
