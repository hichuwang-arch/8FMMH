<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>8F助理員專用系統</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        .main-wrapper { display: flex; height: 100vh; width: 100vw; position: relative; }
        
        /* 側邊欄樣式 */
        .sidebar { 
            width: 220px; background: #2c3e50; color: white; 
            display: flex; flex-direction: column; flex-shrink: 0; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.2); z-index: 10;
            transition: all 0.3s ease;
            overflow-x: hidden;
        }

        /* 💡 側邊欄隱藏時的狀態 */
        .sidebar.collapsed {
            width: 0;
            margin-left: 0; 
        }

        .sidebar-header { padding: 25px 20px; font-weight: bold; font-size: 18px; background: #1a252f; text-align: center; white-space: nowrap; }
        .nav-item { 
            padding: 18px 20px; cursor: pointer; border-left: 5px solid transparent; 
            transition: 0.3s; font-size: 16px;
            white-space: nowrap; 
        }
        .nav-item:hover { background: #34495e; }
        .nav-item.active { background: #3498db; border-left-color: #fff; }

        .content-frame-container { flex-grow: 1; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* 漢堡選單按鈕 */
        .toggle-btn {
            position: absolute;
            top: 10px;
            left: 10px; 
            z-index: 20;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }
        .toggle-btn:hover { background: #3498db; }

        @media print { .sidebar, .toggle-btn { display: none !important; } }
    </style>
</head>
<body>

<button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">☰</button>

<div class="main-wrapper">
    <aside class="sidebar collapsed" id="sidebar">
        <div class="sidebar-header" style="padding-left: 50px;">8F助理員系統</div>
        <div class="nav-item active" onclick="switchFrame('page1.html', this)">助理員工作登記表</div>
        <div class="nav-item" onclick="switchFrame('page2.html', this)">缺物登記紀錄表</div>
        <div class="nav-item" onclick="switchFrame('page3.html', this)">請修登記紀錄表</div>
     </aside>

    <main class="content-frame-container">
        <iframe id="display_box" src="page1.html"></iframe>
    </main>
</div>

<script>
    function switchFrame(url, el) {
        document.getElementById('display_box').src = url;
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        
        // 點擊後自動收起選單 (不論螢幕寬度，如果你希望點了功能就收起來)
        const sidebar = document.getElementById('sidebar');
        if (!sidebar.classList.contains('collapsed')) {
            toggleSidebar();
        }
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
    }
</script>

</body>
</html>
