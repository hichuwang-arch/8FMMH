<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>缺物登記紀錄表</title>
    <style>
        @page { size: landscape; margin: 1cm; }
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; background: #f0f3f5; }
        .page { background: white; width: 1050px; margin: auto; padding: 25px; border: 1px solid #ccc; position: relative; min-height: 700px; }
        h1 { text-align: center; font-size: 28px; letter-spacing: 8px; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid black; padding: 6px 2px; text-align: center; height: 45px; vertical-align: middle; }
        th { background-color: #f2f2f2; font-size: 15px; }
        .col-date { width: 125px; } 
        .col-name { width: 220px; }
        .col-status { width: 130px; }
        .col-stamp { width: 110px; }
        .col-note { width: auto; }
        .col-del { width: 40px; }
        
        /* 統一輸入框樣式，確保文字清晰 */
        input[type="date"], input[type="text"] { width: 95%; border: none; outline: none; font-size: 15px; text-align: center; background: transparent; color: black; opacity: 1; -webkit-text-fill-color: black; }
        
        /* 💡 重新定義「鎖定」樣式：背景不變，僅顯示禁止符號 */
        .cell-locked { 
            background-color: white !important; /* 確保背景保持白色 */
            cursor: not-allowed; /* 滑鼠變成禁止圖示 */
        }
        
        /* 💡 關鍵：禁用 input 和 select 的所有滑鼠事件 */
        .cell-locked input, .cell-locked select { 
            color: black !important; /* 文字保持黑色 */
            -webkit-text-fill-color: black !important; /* 針對 Webkit 瀏覽器強制黑色 */
            pointer-events: none; /* 禁用點擊、選擇等所有滑鼠事件 */
            cursor: not-allowed; /* 保險起見，輸入框本身也設為禁止圖示 */
        }

        .status-select { width: 90%; height: 32px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; color: black; opacity: 1; }
        .status-default { background-color: #fff; color: #7f8c8d; }
        .status-applied { background-color: #fff9db; color: #f39c12; }
        .status-received { background-color: #f6ffed; color: #52c41a; }
        .status-waiting { background-color: #e6f7ff; color: #1890ff; }
        .status-oos { background-color: #fff1f0; color: #f5222d; }
        
        .row-new { background-color: #fff9db !important; }
        .stamp { display: inline-block; border: 2px solid #d63031; color: #d63031; font-family: "標楷體", serif; font-weight: bold; font-size: 13px; padding: 2px; border-radius: 4px; transform: rotate(-5deg); }
        .control-panel { background: #2c3e50; color: white; padding: 12px 20px; width: 1050px; margin: 0 auto 10px auto; border-radius: 8px; display: flex; gap: 15px; align-items: center; box-sizing: border-box; }
        #user_select { height: 38px; width: 210px; font-size: 16px; border-radius: 5px; }
        .btn { padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; border: none; font-size: 14px; }
        .btn-add { background: #27ae60; color: white; }
        .btn-stamp { background: #e67e22; color: white; }
        .btn-save { background: #f1c40f; color: #2c3e50; }
        @media print { .control-panel, .col-del, #del_header { display: none !important; } .page { border: none; width: 100%; } .status-select { border: none; -webkit-appearance: none; appearance: none; background: transparent !important; color: black !important; } }
    </style>
</head>
<body>

<div class="control-panel">
    <div>
        <span style="font-weight:bold;">👤 執行人：</span>
        <select id="user_select" onchange="handleUserChange()"></select>
    </div>
    <div style="margin-left: auto; display: flex; gap: 8px;">
        <button class="btn btn-add" onclick="addRow()">➕ 新增項目</button>
        <button class="btn btn-stamp" onclick="stampAllAndSave()">🏮 存檔簽章</button>
        <button class="btn btn-save" onclick="manualSave()">💾 儲存修改</button>
        <button class="btn" style="background:#3498db; color:white;" onclick="window.print()">📤 列印</button>
    </div>
</div>

<div class="page">
    <h1>缺 物 登 記 表</h1>
    <table id="itemTable">
        <thead>
            <tr>
                <th class="col-date">日期</th>
                <th class="col-name">缺物名稱</th>
                <th class="col-status">處理狀態</th>
                <th class="col-stamp">申請人簽章</th>
                <th class="col-note">其他備註</th>
                <th class="col-del" id="del_header" style="display:none;"></th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const staffList = ["3632-林咨璇", "M820-李筱薇", "M599-賴玉玫", "M944-謝家榆", "M956-林詩涵", "M976-林芝妘", "N007-陳郁婷", "E578-王淑娟", "M798-吳依蓁", "N513-葉懿嬋", "N530-龍家文", "N639-曾意晴", "N645-賴妙貞", "N881-曾莉雯", "N994-林昱均", "M028-董祐慈", "M226-徐郁雯", "M296-吳佳玲", "M343-黃悅綺", "M510-陳建儒", "M536-張盈綺", "M637-劉佳豫", "M697-張文甄", "N054-陳思宇", "M701-蔡昀珊", "M775-劉芷凌", "M240-黃茗媐", "N047-劉芳柔", "2801-新人專用"];
    const dbKey = "8F_MISSING_ITEMS_V16"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyve4I9dSxGnig8z9pOzXwMaYewGuTuLFn71tEo3dmMYazW4hT57QEk5apakJg4WEF1AA/exec"; 

    let items = [];

    function initUserList() {
        const select = document.getElementById('user_select');
        select.innerHTML = '<option value="">-- 請選擇人員 --</option>';
        staffList.forEach(name => select.add(new Option(name, name)));
    }

    function handleUserChange() {
        const select = document.getElementById('user_select');
        if (select.value === "2801-新人專用") {
            const id = prompt("請輸入員編：");
            if (id) {
                const name = `2801 (${id})`;
                if (![...select.options].some(o => o.value === name)) select.add(new Option(name, name));
                select.value = name;
            }
        }
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        const user = document.getElementById('user_select').value;
        const isAdmin = ["N047", "M240", "E578"].some(p => user.startsWith(p));
        document.getElementById('del_header').style.display = isAdmin ? "table-cell" : "none";

        items.forEach((item, index) => {
            const tr = document.createElement('tr');
            if (item.isNew) tr.className = "row-new";
            
            // 💡 權限判斷
            const canEdit = item.isNew || (user !== "" && item.stamp === user) || isAdmin;
            // 💡 如果不能編輯，就套用 cell-locked 類別
            const lockedClass = canEdit ? "" : "cell-locked"; 

            let sClass = "status-default";
            if(item.status === "已申請") sClass = "status-applied";
            if(item.status === "已回") sClass = "status-received";
            if(item.status === "待回") sClass = "status-waiting";
            if(item.status === "缺貨中") sClass = "status-oos";

            tr.innerHTML = `
                <td class="${lockedClass}"><input type="date" value="${item.date}" onchange="updateItem(${index}, 'date', this.value)"></td>
                <td class="${lockedClass}"><input type="text" value="${item.name}" onchange="updateItem(${index}, 'name', this.value)"></td>
                <td class="${lockedClass}">
                    <select class="status-select ${sClass}" onchange="updateItem(${index}, 'status', this.value)">
                        <option value="未處理" ${item.status==='未處理'?'selected':''}>未處理</option>
                        <option value="已申請" ${item.status==='已申請'?'selected':''}>已申請</option>
                        <option value="已回" ${item.status==='已回'?'selected':''}>已回</option>
                        <option value="待回" ${item.status==='待回'?'selected':''}>待回</option>
                        <option value="缺貨中" ${item.status==='缺貨中'?'selected':''}>缺貨中</option>
                    </select>
                </td>
                <td>${item.stamp ? `<span class="stamp">${item.stamp.replace('-', '<br>')}</span>` : ''}</td>
                <td class="${lockedClass}"><input type="text" style="text-align:left; padding-left:5px;" value="${item.note || ''}" onchange="updateItem(${index}, 'note', this.value)"></td>
                <td style="display:${isAdmin ? 'table-cell' : 'none'}"><button style="color:red; background:none; border:none; cursor:pointer;" onclick="deleteRow(${index})">✖</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- 其餘函式保持不變 ---
    function addRow() { 
        const newId = Date.now() + Math.random().toString(36).substr(2, 9);
        items.push({ date: new Date().toISOString().split('T')[0], name: "", status: "未處理", stamp: "", note: "", isNew: true, id: newId }); 
        renderTable(); 
    }

    function updateItem(index, field, value) { 
        items[index][field] = value; 
        if(field === 'status') renderTable(); 
    }

    async function stampAllAndSave() {
        const user = document.getElementById('user_select').value;
        if(!user) return alert("請先選擇執行人！");
        let count = 0;
        items.forEach(item => { 
            if(item.name && !item.stamp) { 
                item.stamp = user; 
                item.isNew = false; 
                count++;
            } 
        });
        saveToLocal();
        await syncToCloud();
        renderTable();
        alert(count > 0 ? "簽章完成並同步雲端！" : "沒有需要簽章的新項目。");
    }

    async function manualSave() { 
        items.forEach(item => {
            item.isNew = false;
            if(!item.id) item.id = Date.now() + Math.random().toString(36).substr(2, 9);
        });
        saveToLocal(); 
        await syncToCloud();
        renderTable();
        alert("所有修改已同步至雲端！"); 
    }

    function deleteRow(index) {
        if(confirm("確定刪除？")) {
            items.splice(index, 1);
            saveToLocal();
            syncToCloud();
            renderTable();
        }
    }

    function saveToLocal() { localStorage.setItem(dbKey, JSON.stringify(items)); }

    async function syncToCloud() {
        try {
            await fetch(GAS_URL, { method: "POST", body: JSON.stringify(items) });
        } catch (e) { console.error("雲端同步失敗"); }
    }

    async function loadFromCloud() {
        try {
            const response = await fetch(GAS_URL);
            const cloudData = await response.json();
            items = cloudData || []; 
            saveToLocal();
            renderTable();
        } catch (e) { 
            items = JSON.parse(localStorage.getItem(dbKey)) || [];
            renderTable();
        }
    }

    window.onbeforeunload = function() {
        if (items.some(item => item.isNew)) return "有資料尚未存檔！";
    };

    window.onload = () => { 
        initUserList(); 
        loadFromCloud(); 
    };
</script>
</body>
</html>
