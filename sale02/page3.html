<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>請修登記表</title>
    <style>
        @page { size: landscape; margin: 1cm; }
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; background: #f0f3f5; }
        .page { background: white; width: 1150px; margin: auto; padding: 25px; border: 1px solid #ccc; position: relative; min-height: 700px; }
        h1 { text-align: center; font-size: 28px; letter-spacing: 8px; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid black; padding: 6px 2px; text-align: center; height: 45px; vertical-align: middle; }
        th { background-color: #f2f2f2; font-size: 14px; }

        /* 💡 欄位寬度調整：縮短備註，增加狀態與開單長度 */
        .col-date   { width: 110px; } 
        .col-name   { width: 200px; }
        .col-order  { width: 170px; }  /* 增加長度 */
        .col-status { width: 170px; }  /* 增加長度 */
        .col-stamp  { width: 100px; }
        .col-note   { width: auto;  }  /* 剩餘空間給備註 */
        .col-del    { width: 40px;  }

        input[type="date"], input[type="text"] { 
            width: 95%; border: none; outline: none; font-size: 14px; 
            text-align: center; background: transparent; color: black !important;
            opacity: 1 !important; -webkit-text-fill-color: black !important;
        }

        .cell-locked { cursor: not-allowed !important; }
        .cell-locked input, .cell-locked select { pointer-events: none; cursor: not-allowed !important; }

        .status-select { width: 95%; height: 32px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; cursor: pointer; text-align: center; font-size: 13px; color: black !important; opacity: 1 !important; }
        .order-none { background-color: #f5f5f5; color: #999; }
        .order-done { background-color: #fff7e6; color: #fa8c16; border-color: #ffd591; }
        .status-pending { background-color: #fff; color: #7f8c8d; }
        .status-applied { background-color: #fff9db; color: #f39c12; }
        .status-repairing { background-color: #e6f7ff; color: #1890ff; }
        .status-done { background-color: #f6ffed; color: #52c41a; }
        
        .row-new { background-color: #fff9db !important; }
        .stamp { display: inline-block; border: 2px solid #d63031; color: #d63031; font-family: "標楷體", serif; font-weight: bold; font-size: 12px; padding: 2px; border-radius: 4px; transform: rotate(-5deg); }
        
        .control-panel { background: #2c3e50; color: white; padding: 12px 20px; width: 1150px; margin: 0 auto 10px auto; border-radius: 8px; display: flex; gap: 15px; align-items: center; box-sizing: border-box; }
        select { height: 38px; font-size: 15px; border-radius: 5px; padding: 0 5px; }
        .btn { padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; border: none; font-size: 14px; }
        .btn-add { background: #27ae60; color: white; }
        .btn-stamp { background: #e67e22; color: white; }
        .btn-save { background: #f1c40f; color: #2c3e50; }
        
        @media print { .control-panel, .col-del, #del_header { display: none !important; } body { background: white; padding: 0; } .page { border: none; width: 100%; padding: 0; margin: 0; } }
    </style>
</head>
<body>

<div class="control-panel">
    <div>
        <span style="font-weight:bold;">👤 執行人：</span>
        <select id="user_select" onchange="handleUserChange()"></select>
    </div>
    <div style="margin-left: 20px;">
        <span style="font-weight:bold;">📅 顯示月份：</span>
        <select id="filter_month" onchange="renderTable()"></select>
    </div>
    <div style="margin-left: auto; display: flex; gap: 8px;">
        <button class="btn btn-add" onclick="addRow()">➕ 新增項目</button>
        <button class="btn btn-stamp" onclick="stampAllAndSave()">🏮 存檔簽章</button>
        <button class="btn btn-save" onclick="manualSave()">💾 儲存資料</button>
        <button class="btn" style="background:#3498db; color:white;" onclick="window.print()">📤 列印</button>
    </div>
</div>

<div class="page">
    <h1 id="page_title">請 修 登 記 表</h1>
    <table id="itemTable">
        <thead>
            <tr>
                <th class="col-date">填單日期</th>
                <th class="col-name">請修項目</th>
                <th class="col-order">請修單開立</th>
                <th class="col-status">目前狀態</th>
                <th class="col-stamp">申請人簽章</th>
                <th class="col-note">其他備註</th>
                <th class="col-del" id="del_header" style="display:none;"></th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    // JS 部分保持不變，包含自動月份選單、權限鎖定與開單彈窗邏輯
    const staffList = ["3632-林咨璇", "M820-李筱薇", "M599-賴玉玫", "M944-謝家榆", "M956-林詩涵", "M976-林芝妘", "N007-陳郁婷", "E578-王淑娟", "M798-吳依蓁", "N513-葉懿嬋", "N530-龍家文", "N639-曾意晴", "N645-賴妙貞", "N881-曾莉雯", "N994-林昱均", "M028-董祐慈", "M226-徐郁雯", "M296-吳佳玲", "M343-黃悅綺", "M510-陳建儒", "M536-張盈綺", "M637-劉佳豫", "M697-張文甄", "N054-陳思宇", "M701-蔡昀珊", "M775-劉芷凌", "M240-黃茗媐", "N047-劉芳柔", "2801-新人專用"];
    const dbKey = "8F_REPAIR_ITEMS_V2"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwDVQVKTeCKcVA4l92EP9J6ekKl_JvoTrL2j-uYzB_zcneAFgh-BAmgXHczYRTfGlFv/exec"; 

    let items = [];

    function initMonthFilter() {
        const select = document.getElementById('filter_month');
        const displayCount = 6; 
        const now = new Date();
        select.innerHTML = "";
        for (let i = 0; i < displayCount; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            if (d.getFullYear() < 2026 || (d.getFullYear() === 2026 && d.getMonth() + 1 < 3)) break;
            const val = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            const text = `${d.getFullYear()}年 ${d.getMonth() + 1}月`;
            select.add(new Option(text, val));
        }
        select.selectedIndex = 0;
    }

    function initUserList() {
        const select = document.getElementById('user_select');
        select.innerHTML = '<option value="">-- 請選擇人員 --</option>';
        staffList.forEach(name => select.add(new Option(name, name)));
    }

    function handleUserChange() {
        const select = document.getElementById('user_select');
        if (select.value === "2801-新人專用") {
            const id = prompt("請輸入員編：");
            if (id) {
                const name = `2801 (${id})`;
                if (![...select.options].some(o => o.value === name)) select.add(new Option(name, name));
                select.value = name;
            }
        }
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        const user = document.getElementById('user_select').value;
        const filterMonth = document.getElementById('filter_month').value;
        const isAdmin = ["N047", "M240", "E578"].some(p => user.startsWith(p));
        document.getElementById('del_header').style.display = isAdmin ? "table-cell" : "none";
        
        const [y, m] = filterMonth.split('-');
        document.getElementById('page_title').innerText = `${y}年${m}月 請 修 登 記 表`;

        items.forEach((item, index) => {
            if (!item.date.startsWith(filterMonth) && !item.isNew) return;

            const tr = document.createElement('tr');
            if (item.isNew) tr.className = "row-new";
            
            const canEdit = item.isNew || (user !== "" && item.stamp === user) || isAdmin;
            const lockedClass = canEdit ? "" : "cell-locked"; 

            let orderClass = item.repairOrder === "已開單" ? "order-done" : "order-none";
            let statusClass = "status-pending";
            if(item.status === "已請修待完成") statusClass = "status-repairing";
            if(item.status === "已完成") statusClass = "status-done";
            if(item.status === "已修待開單") statusClass = "status-applied";

            tr.innerHTML = `
                <td class="${lockedClass}"><input type="date" value="${item.date}" onchange="updateItem(${index}, 'date', this.value)"></td>
                <td class="${lockedClass}"><input type="text" value="${item.name}" onchange="updateItem(${index}, 'name', this.value)"></td>
                <td class="${lockedClass}">
                    <select class="status-select ${orderClass}" onchange="updateItem(${index}, 'repairOrder', this.value)">
                        <option value="未開單" ${item.repairOrder==='未開單'?'selected':''}>未開單</option>
                        <option value="已開單" ${item.repairOrder==='已開單'?'selected':''}>已開單</option>
                    </select>
                </td>
                <td class="${lockedClass}">
                    <select class="status-select ${statusClass}" onchange="updateItem(${index}, 'status', this.value)">
                        <option value="待處理" ${item.status==='待處理請修'?'selected':''}>待處理請修</option>
                        <option value="已請修待完成" ${item.status==='已請修待完成'?'selected':''}>已請修待完成</option>
                        <option value="已完成" ${item.status==='已完成請修'?'selected':''}>已完成請修</option>
                        <option value="已修待開單" ${item.status==='已處理開單'?'selected':''}>已處理待開單</option>
                    </select>
                </td>
                <td>${item.stamp ? `<span class="stamp">${item.stamp.replace('-', '<br>')}</span>` : ''}</td>
                <td class="${lockedClass}"><input type="text" style="text-align:left; padding-left:5px;" value="${item.note || ''}" onchange="updateItem(${index}, 'note', this.value)"></td>
                <td style="display:${isAdmin ? 'table-cell' : 'none'}"><button style="color:red; background:none; border:none; cursor:pointer;" onclick="deleteRow(${index})">✖</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function addRow() { 
        const newId = "ID-" + Date.now() + "-" + Math.floor(Math.random() * 1000);
        items.push({ date: new Date().toISOString().split('T')[0], name: "", repairOrder: "未開單", status: "待處理請修", stamp: "", note: "", isNew: true, id: newId }); 
        renderTable(); 
    }
    
    function updateItem(index, field, value) { 
        items[index][field] = value; 
        if (field === 'repairOrder' && value === '已開單') {
            const orderNum = prompt("請輸入請修單號：");
            if (orderNum && orderNum.trim() !== "") {
                const originalNote = items[index]['note'] || "";
                if (!originalNote.includes("單號:")) {
                    items[index]['note'] = `[單號:${orderNum}] ` + originalNote;
                }
                items[index]['status'] = '已請修待完成';
            } else {
                items[index]['repairOrder'] = '未開單';
                alert("未輸入單號，狀態已回復為未開單。");
            }
        }
        renderTable(); 
    }

    async function deleteRow(index) { 
        if(confirm("確定刪除此筆資料並同步至雲端？")) { 
            items.splice(index, 1); saveToLocal(); renderTable(); await syncToCloud();
        } 
    }
    async function stampAllAndSave() {
        const user = document.getElementById('user_select').value;
        if(!user) return alert("請選擇執行人！");
        let count = 0;
        items.forEach(item => { if(item.name && !item.stamp) { item.stamp = user; item.isNew = false; count++; } });
        saveToLocal(); renderTable(); await syncToCloud(); alert(count > 0 ? `已完成 ${count} 項簽章並同步至雲端！` : "同步完成！");
    }
    async function manualSave() { 
        items.forEach(item => { item.isNew = false; if(!item.id) item.id = "ID-" + Date.now(); });
        saveToLocal(); renderTable(); await syncToCloud(); alert("資料已儲存並同步至雲端！"); 
    }
    function saveToLocal() { localStorage.setItem(dbKey, JSON.stringify(items)); }
    async function syncToCloud() {
        try { await fetch(GAS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(items) }); } catch (e) { console.error("雲端同步失敗", e); }
    }
    async function loadFromCloud() {
        try {
            const response = await fetch(`${GAS_URL}?t=${Date.now()}`);
            const cloudData = await response.json();
            if (Array.isArray(cloudData)) { items = cloudData; saveToLocal(); }
        } catch (e) { items = JSON.parse(localStorage.getItem(dbKey)) || []; }
        renderTable();
    }
    
    window.onload = () => { 
        initMonthFilter();
        initUserList(); 
        loadFromCloud(); 
    };
</script>
</body>
</html>
