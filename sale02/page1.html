<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8F助理護理員每日協助工作登記表</title>
    <style>
        /* --- 樣式設定 --- */
        body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; padding: 5px; background-color: #f4f7f6; color: #000; }
        
        /* 💡 標題優化 */
        .header { text-align: center; margin-bottom: 10px; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .header h2 { margin: 0 0 10px 0; text-decoration: underline; font-size: 20px; color: #333; }
        
        .info-row { display: flex; flex-direction: column; gap: 10px; margin: 0 10px; font-weight: bold; font-size: 14px; }
        .date-input { border: 1px solid #ccc; border-radius: 4px; padding: 5px; font-family: inherit; font-size: 16px; width: 100%; background: #fffbe6; text-align: center; box-sizing: border-box; }

        /* 💡 容器優化：電腦並排，手機堆疊 */
        .container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; width: 100%; }
        
        /* 💡 表格滑動保護 */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        table { border-collapse: collapse; width: 100%; min-width: 550px; table-layout: fixed; border: 1px solid #000; }
        th, td { border: 1px solid #ddd; text-align: center; padding: 5px 2px; height: 40px; vertical-align: middle; }
        th { background-color: #e6f7ff; color: #003a8c; font-weight: bold; font-size: 13px; border: 1px solid #000; }
        
        .bed-no { width: 55px; font-weight: bold; background-color: #f9f9f9 !important; font-size: 15px; color: #d4380d; border-right: 2px solid #000; }
        .remark-col { width: 120px; } 

        td:has(input[type="checkbox"]:checked) { background-color: #fffbe6; }
        input[type="checkbox"] { width: 24px; height: 24px; cursor: pointer; } /* 💡 放大勾選框 */
        .input-text { width: 96%; border: none; outline: none; font-size: 14px; background: transparent; text-align: center; border-bottom: 1px dashed #ccc; }

        /* 摘要與簽署 */
        .summary-container { margin: 15px 5px; padding: 12px; border-radius: 8px; border: 1px solid #000; background-color: #fff; }
        .log-container { margin: 15px 5px; padding: 10px; background: white; border-radius: 8px; }
        .id-badge { display: inline-block; background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; padding: 4px 12px; border-radius: 20px; font-weight: bold; margin: 4px; font-size: 13px; }

        /* 按鈕組 */
        .btn-group { margin: 20px 0; padding: 0 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px; font-weight: bold; font-size: 16px; border: none; cursor: pointer; border-radius: 8px; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-save { background: #52c41a; grid-column: span 2; }
        .btn-print { background: #1890ff; }
        .btn-summary { background: #722ed1; }
        .btn-clear { background: #ff4d4f; grid-column: span 2; margin-top: 10px; opacity: 0.8; }

        /* 📱 手機版 RWD 微調 */
        @media screen and (min-width: 1024px) {
            .container { flex-wrap: nowrap; }
            .table-responsive { width: 49%; }
            .info-row { flex-direction: row; justify-content: space-between; }
            .date-input { width: 200px; }
            .btn-group { display: flex; }
        }

        @media print {
            .no-print { display: none !important; }
            .container { flex-wrap: nowrap; gap: 2px; }
            .table-responsive { width: 50%; overflow: visible; box-shadow: none; }
            table { min-width: auto; font-size: 12px; }
            th, td { height: 25px; border: 1px solid #000; }
            .btn-group, .log-container { display: none !important; }
        }
    </style>
</head>
<body>

<div class="header">
    <h2>每日協助工作登記表</h2>
    <div class="info-row">
        <span>日期：<input type="date" id="todayDate" class="date-input"></span>
        <span style="font-size: 12px; color: #666; text-align: left;">
            1.大夜協助勾選，白班核對後請助理員執行<br>
            2.半年內新人Foley/PP/NG Care請自行完成
        </span>
    </div>
</div>

<div class="container">
    <div class="table-responsive">
        <table id="table-1">
            <thead>
                <tr>
                    <th class="bed-no">床號</th>
                    <th>鼻胃管<br>護理</th><th>鼻胃管<br>灌食</th><th>導尿管<br>護理</th><th>會陰<br>清潔</th><th>ON<br>氣墊床</th>
                    <th class="remark-col">備註</th>
                </tr>
            </thead>
            <tbody id="left-table"></tbody>
        </table>
    </div>
    <div class="table-responsive">
        <table id="table-2">
            <thead>
                <tr>
                    <th class="bed-no">床號</th>
                    <th>鼻胃管<br>護理</th><th>鼻胃管<br>灌食</th><th>導尿管<br>護理</th><th>會陰<br>清潔</th><th>ON<br>氣墊床</th>
                    <th class="remark-col">備註</th>
                </tr>
            </thead>
            <tbody id="right-table"></tbody>
        </table>
    </div>
</div>

<div id="printSummary" class="summary-container">
    <div style="font-weight:bold; color:#003a8c; margin-bottom:8px;">【 今日工作摘要 】</div>
    <div id="summaryContent" style="color: #333; font-size: 14px; line-height: 1.5;">尚未有勾選項目</div>
</div>

<div class="log-container">
    <div style="font-weight:bold; margin-bottom:5px;">存檔簽署名單：</div>
    <div id="idList"><span style="color:#ccc;">讀取中...</span></div>
</div>

<div class="btn-group no-print">
    <button id="saveBtn" class="btn btn-save" onclick="saveWithID()">✅ 儲存並簽署</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 列印 A4</button>
    <button class="btn btn-summary" onclick="printOnlySummary()">📋 僅印摘要</button>
    <button class="btn btn-clear" onclick="clearAll()">🗑️ 全部清除</button>
</div>

<script>
    // --- JavaScript 邏輯保持不變 ---
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwuarBulYwh_Xs43fKHVUbGIm67djnLgOyAkE3flvAeEaIR0GD1VeWrX3AcLboZ_RWJmA/exec";
    const staffMap = {
        "3632": "林咨璇", "M820": "李筱薇", "M599": "賴玉玫", "M944": "謝家榆",
        "M956": "林詩涵", "M976": "林芝妘", "N007": "陳郁婷", "E578": "王淑娟",
        "M798": "吳依蓁", "N513": "葉懿嬋", "N530": "龍家文", "N639": "曾意晴",
        "N645": "賴妙貞", "N881": "曾莉雯", "N994": "林昱均", "M028": "董祐慈",
        "M226": "徐郁雯", "M296": "吳佳玲", "M343": "黃悅綺", "M510": "陳建儒",
        "M536": "張盈綺", "M637": "劉佳豫", "M697": "張文甄", "N054": "陳思宇",
        "M701": "蔡昀珊", "M775": "劉芷凌", "M240": "黃茗媐", "N047": "劉芳柔"
    };

    const leftBeds = ['01A','01B','01C','01D','02A','02B','03A','03B','04A','04B','05A','05B','06A','06B','07A','07B','08A','08B','09A','09B','10A','10B','11A','11B','12','13','14','15','16'];
    const rightBeds = ['17','18A','18B','18C','18D','19A','19B','19C','19D','20A','20B','20C','20D','21A','21B','21C','21D','22A','22B','22C','22D','23A','23B','23C','23D','24A','24B','24C','24D'];
    const taskNames = ["鼻胃管護理", "鼻胃管灌食", "導尿管護理", "會陰清潔", "ON氣墊床"]; 

    function fixDateDisplay() {
        const dateInput = document.getElementById('todayDate');
        const now = new Date();
        const offset = now.getTimezoneOffset() * 60000;
        const localDate = new Date(now.getTime() - offset).toISOString().split('T')[0];
        dateInput.value = localDate;
        return localDate;
    }

    function renderTable(beds, elementId) {
        const container = document.getElementById(elementId);
        beds.forEach((bed, bedIdx) => {
            const tr = document.createElement('tr');
            let cols = `<td class="bed-no">${bed}</td>`;
            for(let i=0; i<taskNames.length; i++) {
                cols += `<td><input type="checkbox" id="${elementId}-check-${bedIdx}-${i}" onchange="updateSummary()"></td>`;
            }
            cols += `<td><input type="text" class="input-text" id="${elementId}-text-${bedIdx}"></td>`;
            tr.innerHTML = cols;
            container.appendChild(tr);
        });
    }

    function updateSummary() {
        const summaryContent = document.getElementById('summaryContent');
        let report = {};
        taskNames.forEach(name => report[name] = []);
        ['left-table', 'right-table'].forEach(tableId => {
            const beds = (tableId === 'left-table') ? leftBeds : rightBeds;
            beds.forEach((bed, bedIdx) => {
                for (let taskIdx = 0; taskIdx < taskNames.length; taskIdx++) {
                    const checkbox = document.getElementById(`${tableId}-check-${bedIdx}-${taskIdx}`);
                    if (checkbox && checkbox.checked) report[taskNames[taskIdx]].push(bed);
                }
            });
        });
        let html = "";
        let hasData = false;
        taskNames.forEach(name => {
            if (report[name].length > 0) {
                html += `<div><strong>${name}</strong>：${report[name].join('、')}</div>`;
                hasData = true;
            }
        });
        summaryContent.innerHTML = hasData ? html : '尚未有勾選項目';
    }

    async function saveWithID() {
        const empIdInput = prompt("請輸入您的員工代號以完成簽署：");
        if (!empIdInput) return;
        const empId = empIdInput.trim().toUpperCase();
        const btn = document.getElementById('saveBtn');
        btn.innerText = "⏳ 同步中...";
        btn.disabled = true;
        const formData = {};
        document.querySelectorAll('input').forEach(input => {
            if (input.type === 'checkbox') formData[input.id] = input.checked;
            else formData[input.id] = input.value;
        });
        localStorage.setItem('8F_nursing_data', JSON.stringify(formData));
        try {
            await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ empId: empId, formData: formData }) });
            btn.innerText = "✅ 儲存成功";
            setTimeout(() => { btn.innerText = "✅ 儲存並簽署"; btn.disabled = false; loadFromCloud(); }, 1000);
        } catch (e) { alert("連線失敗"); btn.disabled = false; }
    }

    function applyFormData(data) {
        if (!data) return;
        Object.keys(data).forEach(id => {
            if (id === 'todayDate') return; 
            const el = document.getElementById(id);
            if (el) {
                if (el.type === 'checkbox') el.checked = data[id];
                else el.value = data[id];
            }
        });
        updateSummary();
    }

    async function loadFromCloud() {
        const today = fixDateDisplay(); 
        try {
            const response = await fetch(GAS_URL);
            const result = await response.json();
            if (result.formData && String(result.formData.todayDate) === String(today)) {
                applyFormData(result.formData);
                localStorage.setItem('8F_nursing_data', JSON.stringify(result.formData));
            }
            const idListDiv = document.getElementById('idList');
            if (result.empIds && result.formData && String(result.formData.todayDate) === String(today)) {
                idListDiv.innerHTML = result.empIds.map(id => {
                    const name = staffMap[id.toUpperCase()] || "新";
                    return `<span class="id-badge">${id}-${name}</span>`;
                }).join('');
            } else {
                idListDiv.innerHTML = `<span style="color:#ccc;">今日尚無紀錄</span>`;
            }
        } catch (e) { console.warn("同步失敗"); }
    }

    async function clearAll() {
        if (confirm('⚠️ 警告：這將徹底清除今日雲端內容！')) {
            try {
                await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "clearAll" }) });
                location.reload();
            } catch (e) { alert("連線異常"); }
        }
    }

    function printOnlySummary() {
        document.body.classList.add('print-summary-only');
        window.print();
        setTimeout(() => document.body.classList.remove('print-summary-only'), 500);
    }

    renderTable(leftBeds, 'left-table');
    renderTable(rightBeds, 'right-table');
    window.onload = loadFromCloud;
</script>
</body>
</html>
